services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
    - 5432:5432
    environment:
      POSTGRES_DB: nvc360
      POSTGRES_PASSWORD: postgres_local
      POSTGRES_USER: postgres
    command:
    - postgres
    - -c
    - ssl=on
    - -c
    - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
    - -c
    - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    volumes:
    - pg-data:/var/lib/postgresql/data
    - /Users/joel/code/nvc360/ArrivePingDRv1/infra/terraform/envs/local/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d nvc360
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
    - 6379:6379
  web:
    image: oven/bun:alpine
    ports:
    - 5173:5173
    depends_on:
    - db
    - redis
    environment:
      BETTER_AUTH_URL: http://localhost:5173
      DATABASE_SYSTEM_URL: postgres://app_system:app_system_local@db:5432/nvc360
      DATABASE_URL: postgres://app_runtime:app_runtime_local@db:5432/nvc360
      REDIS_URL: redis://redis:6379
      SUPABASE_MIGRATION_URL: postgres://postgres:postgres_local@db:5432/nvc360
    entrypoint:
    - /bin/sh
    - /repo/dev/docker/entrypoint.sh
    volumes:
    - /Users/joel/code/nvc360/ArrivePingDRv1:/repo
    - node-modules:/repo/node_modules
    - web-node-modules:/repo/packages/web/node_modules
    - desktop-node-modules:/repo/packages/desktop/node_modules
    - mobile-node-modules:/repo/packages/mobile/node_modules
    working_dir: /repo/packages/web
volumes:
  desktop-node-modules: {}
  mobile-node-modules: {}
  node-modules: {}
  pg-data: {}
  web-node-modules: {}
