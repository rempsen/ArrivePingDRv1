name: Ship iOS to TestFlight

# Manually triggered only — either from GitHub's own "Run workflow" button,
# or by the admin dashboard's "Push to TestFlight" button
# (packages/web/src/api/routes/mobile-release.ts), which calls the
# workflow_dispatch API. Never runs automatically on push/PR.
on:
  workflow_dispatch:
    inputs:
      requestedBy:
        description: "Who/what triggered this run"
        required: false
        default: "manual"

# One release at a time. Two clicks a minute apart used to start two builds
# side by side; both then submitted "the latest" build, so the second upload
# was a duplicate and Apple refused it. A second run now waits its turn.
concurrency:
  group: ship-ios
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Write App Store Connect key
        # IOS_ASC_KEY_P8_BASE64 has been stored two different ways across
        # sessions: proper base64 of the *whole* AuthKey.p8 file (headers
        # included), or just the PEM body with its line-wraps flattened to
        # spaces. Decoding the second case with `base64 -d` alone writes
        # mangled binary instead of a valid key — eas-cli still "schedules"
        # the submission fine (it doesn't read the file for that), then
        # Apple-side signing fails with a generic "something went wrong".
        # Handle both without caring which one is actually stored.
        run: |
          mkdir -p keys
          secret="${{ secrets.IOS_ASC_KEY_P8_BASE64 }}"
          decoded="$(printf '%s' "$secret" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$decoded" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$decoded" > keys/AuthKey.p8
          else
            body="$(printf '%s' "$secret" | tr -d '"' | tr ' ' '\n')"
            {
              echo "-----BEGIN PRIVATE KEY-----"
              echo "$body"
              echo "-----END PRIVATE KEY-----"
            } > keys/AuthKey.p8
          fi
          openssl pkey -in keys/AuthKey.p8 -noout -text > /dev/null || {
            echo "::error::keys/AuthKey.p8 is not a valid private key after reconstruction."
            exit 1
          }

      - name: Build iOS app on Expo's servers
        id: build
        # --json prints the finished build to stdout (progress goes to stderr),
        # so the next step submits exactly this build, not whichever is newest.
        run: |
          bunx --yes eas-cli build --platform ios --profile production --non-interactive --json > build.json
          id="$(jq -r '.[0].id // empty' build.json)"
          [ -n "$id" ] || { echo "::error::Couldn't read the build id from eas-cli."; cat build.json; exit 1; }
          echo "Built $(jq -r '(.[0].appVersion // "?") + " (" + (.[0].appBuildVersion // "?") + ")"' build.json): $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to TestFlight
        run: bunx --yes eas-cli submit --platform ios --id "${{ steps.build.outputs.id }}" --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
