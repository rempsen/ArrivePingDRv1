name: Ship iOS app

# Manually triggered only — either from GitHub's own "Run workflow" button,
# or by the admin dashboard's "Release iOS app" button
# (packages/web/src/api/routes/mobile-release.ts), which calls the
# workflow_dispatch API. Never runs automatically on push/PR.
#
# target=app-store (the default since ArrivePing went live, 2026-10-28):
# build, upload, wait for Apple to process the build, then submit it for App
# Store review with "release automatically after approval". The version in
# packages/mobile/app.json must be newer than the live one; a preflight step
# checks that before the build starts.
# target=testflight: build and upload only (testers, no review).
on:
  workflow_dispatch:
    inputs:
      requestedBy:
        description: "Who/what triggered this run"
        required: false
        default: "manual"
      target:
        description: "Where the build goes"
        required: false
        type: choice
        options: [app-store, testflight]
        default: app-store
      releaseNotes:
        description: "What's New text for the App Store (app-store only)"
        required: false
        default: "Improvements and fixes."
      existingBuild:
        description: "Retry only: submit this already-uploaded build number to the App Store instead of building again (app-store only)"
        required: false
        default: ""

# One release at a time. Two clicks a minute apart used to start two builds
# side by side; both then submitted "the latest" build, so the second upload
# was a duplicate and Apple refused it. A second run now waits its turn.
concurrency:
  group: ship-ios
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    # Apple's processing of an upload can take a while before it can be submitted.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: packages/mobile
    env:
      TARGET: ${{ inputs.target || 'app-store' }}
      EXISTING_BUILD: ${{ inputs.existingBuild }}
      # Not secrets: the same ids are in eas.json's submit profile.
      ASC_APP_ID: "6776464675"
      ASC_KEY_ID: "6Y6Z8B2F66"
      ASC_ISSUER_ID: "e5beafb9-51e8-41e3-8818-4b18a424f6b9"
      ASC_KEY_PATH: keys/AuthKey.p8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Write App Store Connect key
        # IOS_ASC_KEY_P8_BASE64 has been stored two different ways across
        # sessions: proper base64 of the *whole* AuthKey.p8 file (headers
        # included), or just the PEM body with its line-wraps flattened to
        # spaces. Decoding the second case with `base64 -d` alone writes
        # mangled binary instead of a valid key — eas-cli still "schedules"
        # the submission fine (it doesn't read the file for that), then
        # Apple-side signing fails with a generic "something went wrong".
        # Handle both without caring which one is actually stored.
        run: |
          mkdir -p keys
          secret="${{ secrets.IOS_ASC_KEY_P8_BASE64 }}"
          decoded="$(printf '%s' "$secret" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$decoded" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$decoded" > keys/AuthKey.p8
          else
            body="$(printf '%s' "$secret" | tr -d '"' | tr ' ' '\n')"
            {
              echo "-----BEGIN PRIVATE KEY-----"
              echo "$body"
              echo "-----END PRIVATE KEY-----"
            } > keys/AuthKey.p8
          fi
          openssl pkey -in keys/AuthKey.p8 -noout -text > /dev/null || {
            echo "::error::keys/AuthKey.p8 is not a valid private key after reconstruction."
            exit 1
          }

      - name: App Store preflight
        # Fails in seconds, not after a 15-minute build, when this version
        # can't be submitted (not newer than live, or one is already in review).
        if: env.TARGET == 'app-store' && env.EXISTING_BUILD == ''
        run: bun scripts/asc/release.ts preflight --version "$(jq -r .expo.version app.json)"

      - name: Build iOS app on Expo's servers
        id: build
        if: env.EXISTING_BUILD == ''
        # --json prints the finished build to stdout (progress goes to stderr),
        # so the next step submits exactly this build, not whichever is newest.
        run: |
          bunx --yes eas-cli build --platform ios --profile production --non-interactive --json > build.json
          id="$(jq -r '.[0].id // empty' build.json)"
          [ -n "$id" ] || { echo "::error::Couldn't read the build id from eas-cli."; cat build.json; exit 1; }
          echo "Built $(jq -r '(.[0].appVersion // "?") + " (" + (.[0].appBuildVersion // "?") + ")"' build.json): $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.[0].appVersion' build.json)" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -r '.[0].appBuildVersion' build.json)" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to App Store Connect
        # Every iOS build lands in App Store Connect (and TestFlight) first;
        # the next step takes it from there to the App Store.
        if: env.EXISTING_BUILD == ''
        run: bunx --yes eas-cli submit --platform ios --id "${{ steps.build.outputs.id }}" --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit for App Store review
        if: env.TARGET == 'app-store'
        run: |
          version="${{ steps.build.outputs.version }}"; build="${{ steps.build.outputs.build }}"
          if [ -n "$EXISTING_BUILD" ]; then version="$(jq -r .expo.version app.json)"; build="$EXISTING_BUILD"; fi
          bun scripts/asc/release.ts submit --version "$version" --build "$build" --notes "$NOTES"
        env:
          NOTES: ${{ inputs.releaseNotes }}
