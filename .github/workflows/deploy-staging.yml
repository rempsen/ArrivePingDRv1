name: Deploy staging

# Continuous delivery for the staging environment (AWS account 293174400261,
# us-east-2). This is the CD half that did not exist before — ci.yml verifies,
# this ships.
#
# Flow: build image -> push to ECR -> register a new ECS task definition
# revision -> roll the service -> wait for stability -> smoke test.
#
# Safety properties:
#   * Runs only after CI passes on main (workflow_run), never in parallel with it.
#   * Concurrency group of 1, no cancel — two overlapping deploys of a
#     single-instance service is how you get a double-fired scheduler.
#   * ECS deployment circuit breaker (configured in Terraform) rolls back
#     automatically if the new task never becomes healthy.
#   * Skips itself cleanly when AWS is not yet configured, so a fork or a repo
#     without the secrets set does not show a permanent red X.
#
# AUTH: GitHub OIDC. No AWS access keys are stored in this repo. Actions mints
# a short-lived OIDC token, AWS trades it for temporary credentials, and the
# trust policy only accepts this repo on refs/heads/main — so a fork, a pull
# request, or another branch cannot deploy.
#
# Set one repo *variable* (Settings -> Secrets and variables -> Actions ->
# Variables), not a secret, since a role ARN is not sensitive:
#     AWS_DEPLOY_ROLE_ARN = arn:aws:iam::293174400261:role/nvc360-staging-github-deploy
#
# (An earlier revision used a long-lived IAM key because
# iam:CreateOpenIDConnectProvider was denied by the organization SCP on this
# account. That restriction was lifted on 2026-08-21 when the account moved off
# the AWS-managed Project plan, and this is the correct setup.)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a manual staging deploy'
        required: true
        default: ""

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: nvc360-staging-web
  ECS_CLUSTER: nvc360-staging
  ECS_SERVICE: nvc360-staging-web
  CONTAINER_NAME: web

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only deploy green CI on main, or an explicitly confirmed manual run.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy')

    steps:
      - name: Check AWS is configured
        id: gate
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN repo variable is not set — skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          # workflow_run gives us the SHA that passed CI, not the tip of main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        if: steps.gate.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: steps.gate.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        if: steps.gate.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.gate.outputs.configured == 'true'
        id: image
        uses: docker/build-push-action@v6
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          context: .
          push: true
          # Tag with the commit SHA (immutable, what the task definition
          # pins) and with staging-latest for human convenience.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SENTRY_ENV=staging
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}

      # Migrations run as a one-off Fargate task BEFORE the service rolls.
      #
      # RDS is private (reachable only from the task security group), so they
      # cannot run from the Actions runner. The task uses the new image, the
      # service's own subnets/security group, and the master credentials from
      # the migrate-config secret; it also creates the app_runtime/app_system
      # roles and sets their passwords. Migrations are forward-only and
      # additive-by-convention, so the previous image keeps working against the
      # migrated schema if the deploy then rolls back. If this step fails the
      # service is not touched.
      - name: Run database migrations
        if: steps.gate.outputs.configured == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${SHA}"
          MIGRATE_FAMILY="${ECS_CLUSTER}-migrate"

          aws ecs describe-task-definition --task-definition "$MIGRATE_FAMILY" \
            --query 'taskDefinition' > /tmp/migrate-taskdef.json

          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions |= map(.image = $IMAGE)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' /tmp/migrate-taskdef.json > /tmp/migrate-newdef.json

          MIGRATE_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/migrate-newdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          NETCFG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$MIGRATE_ARN" \
            --network-configuration "$NETCFG" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$CODE" != "0" ]; then
            echo "::error::Migration task exited with code $CODE. Logs: CloudWatch /nvc360/nvc360-staging/app, stream migrate/migrate/${TASK_ARN##*/}"
            exit 1
          fi
          echo "Migrations applied."

      - name: Deploy to ECS
        if: steps.gate.outputs.configured == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${SHA}"
          echo "Deploying $IMAGE"

          # Take the newest ACTIVE revision of the web family, swap only the
          # image, register a new revision. Everything else (secrets, env,
          # roles, limits) stays as Terraform defined it. Using the family
          # (not the service's current revision) means a `terraform apply` that
          # adds or changes env/secrets reaches the next deploy.
          TASK_DEF="$ECS_SERVICE"

          aws ecs describe-task-definition --task-definition "$TASK_DEF" \
            --query 'taskDefinition' > /tmp/taskdef.json

          jq --arg IMAGE "$IMAGE" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions = (
              .containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end)
            )
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' /tmp/taskdef.json > /tmp/newdef.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/newdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $NEW_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN" > /dev/null

      - name: Wait for the service to stabilise
        if: steps.gate.outputs.configured == 'true'
        run: |
          # The circuit breaker rolls back a bad deploy on its own; this makes
          # the workflow fail loudly when that happens instead of going green.
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Port 80 only redirects to HTTPS now, so test the real public URL
          # (custom domain, ACM cert). Keep in sync with the staging env's
          # `domain` in infra/terraform/envs/staging/main.tf.
          URL="https://demo.v4.nvc360.com"
          echo "Smoke testing $URL"

          # /api/ready does a real database round-trip, so this asserts the app
          # is genuinely serving, not just that a container started.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/ready" || true)
            if [ "$CODE" = "200" ]; then
              echo "Staging is healthy."
              # The SPA shell must also render, or we shipped an API-only box.
              curl -fsS "$URL/" | grep -qi "<div id=\"root\"" \
                && echo "SPA shell served." && exit 0
              echo "::error::API is healthy but the SPA shell did not render."
              exit 1
            fi
            echo "attempt $i: /api/ready returned $CODE"
            sleep 10
          done
          echo "::error::Staging never returned 200 from /api/ready"
          exit 1

      - name: Report
        if: steps.gate.outputs.configured == 'true' && always()
        run: |
          echo "### Staging deploy: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
