<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArrivePing is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #070b12; color: #e8edf5; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #9aa7bb; }
  button { font: inherit; padding: 10px 18px; border-radius: 12px; border: 0; background: #0ea5e9; color: #04121c; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>The map needs a connection. It'll come back as soon as you do.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
