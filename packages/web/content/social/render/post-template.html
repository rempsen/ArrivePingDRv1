<!doctype html>
<html><head><meta charset="utf-8">
<!-- ArrivePing social post template (1080x1350). Rendered by render-posts.ts; the card comes from window.CARD. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0d1b2c;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  .card{width:1080px;height:1350px;position:relative;overflow:hidden;box-sizing:border-box;padding:96px 88px;display:flex;flex-direction:column;justify-content:space-between;
    background:radial-gradient(1100px 800px at 90% 10%, rgba(31,78,140,.6), transparent 70%),radial-gradient(700px 600px at 0% 100%, rgba(14,165,233,.18), transparent 70%),#0d1b2c}
  .card.light{background:#f1f5f9;color:#0d1b2c}
  .rings{position:absolute;border-radius:50%;border:2px solid rgba(59,130,246,.3);pointer-events:none}
  .light .rings{border-color:rgba(31,78,140,.18)}
  .header{display:flex;justify-content:space-between;align-items:center;position:relative}
  .header img{height:64px}
  .kicker{font-size:28px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}
  .light .kicker{color:#1f4e8c}
  .mid{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px}
  h1{font-size:112px;line-height:1.02;font-weight:800;letter-spacing:-.03em;margin:0}
  h1 em{font-style:normal;color:#7dd3fc}
  .light h1 em{color:#1f4e8c}
  h1 s{text-decoration:line-through;text-decoration-color:#f29a2e;text-decoration-thickness:10px;color:#94a3b8}
  p.lead{font-size:40px;line-height:1.3;font-weight:500;color:#cbd5e1;margin:0;max-width:880px}
  .light p.lead{color:#3a4f68}
  .stack{display:flex;flex-direction:column;gap:22px}
  .row{display:flex;align-items:center;gap:26px;font-size:50px;font-weight:700}
  .row i{width:22px;height:22px;border-radius:50%;background:#10b981;flex-shrink:0;display:inline-block}
  .big{font-size:260px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff}
  .big small{font-size:72px;font-weight:700;color:#7dd3fc;letter-spacing:-.02em}
  .bubble{background:#fff;color:#0d1b2c;border-radius:36px;padding:40px 44px;font-size:40px;line-height:1.35;font-weight:500;max-width:840px;box-shadow:0 30px 60px rgba(0,0,0,.35);position:relative}
  .bubble:after{content:"";position:absolute;left:60px;bottom:-26px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
  .bubble b{font-weight:700}
  .bubble .map{margin-top:28px;height:220px;border-radius:20px;background:linear-gradient(135deg,#dbe4ee,#e2e8f0);position:relative;overflow:hidden}
  .bubble .map:before{content:"";position:absolute;left:12%;top:70%;width:70%;height:8px;background:#1f4e8c;border-radius:4px;transform:rotate(-18deg)}
  .bubble .map:after{content:"";position:absolute;left:66%;top:28%;width:34px;height:34px;border-radius:50%;background:#2f7cf6;box-shadow:0 0 0 14px rgba(47,124,246,.25)}
  .tags{display:flex;flex-wrap:wrap;gap:16px}
  .tag{border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:16px 30px;font-size:34px;font-weight:600;color:#e2e8f0}
  .light .tag{border-color:rgba(13,27,44,.2);color:#0d1b2c}
  .bottom{position:relative;display:flex;justify-content:space-between;align-items:flex-end}
  .pill{display:inline-flex;align-items:center;gap:14px;background:rgba(16,185,129,.14);border:2px solid rgba(16,185,129,.5);color:#34d399;border-radius:999px;font-weight:700;font-size:30px;padding:14px 28px;white-space:nowrap}
  .pill i{width:14px;height:14px;border-radius:50%;background:#10b981;display:inline-block}
  .url{font-size:30px;font-weight:600;color:#94a3b8}
  .light .url{color:#3a4f68}
  .browser{border-radius:24px;overflow:hidden;border:4px solid rgba(255,255,255,.14);box-shadow:0 30px 60px rgba(0,0,0,.5);margin-top:10px}.browser img{display:block;width:100%;height:520px;object-fit:cover;object-position:top}
  .two{display:flex;gap:44px;align-items:center}.shot{width:470px;flex-shrink:0;border-radius:40px;overflow:hidden;border:6px solid rgba(255,255,255,.14);box-shadow:0 40px 80px rgba(0,0,0,.5)}.shot img{display:block;width:100%}.txt{display:flex;flex-direction:column;gap:28px}
  .math{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
  .math .cell{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:28px;padding:40px 32px;text-align:center}
  .math .n{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .math .l{font-size:30px;color:#94a3b8;margin-top:14px;font-weight:500}
  .math .vs{font-size:48px;font-weight:700;color:#7dd3fc}
</style>
</head>
<body>
<div id="c" class="card"></div>
<script>
const card = window.CARD;
const c = document.getElementById('c');
for (let i = 0; i < 4; i++) { const r = document.createElement('div'); r.className = 'rings'; const d = 420 + i * 260; r.style.width = r.style.height = d + 'px'; r.style.right = (-d * 0.45) + 'px'; r.style.top = (-d * 0.35) + 'px'; r.style.opacity = String(.9 - i * .2); c.appendChild(r); }
if (card.light) c.classList.add('light');
const pill = card.pill || 'Available now · 30-day free trial';
c.insertAdjacentHTML('beforeend',
  `<div class="header"><img src="../../../public/arriveping-logo-light.png"><span class="kicker">${card.kicker}</span></div>` +
  `<div class="mid">${card.html}</div>` +
  `<div class="bottom"><span class="pill"><i></i>${pill}</span><span class="url">arriveping.com</span></div>`);
</script>
</body></html>
